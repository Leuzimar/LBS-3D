<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16a34a"><link rel="manifest" href="manifest.json"><style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--green:#16a34a;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:var(--bg);color:var(--text)}header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;position:sticky;top:0;z-index:5}header button{background:none;color:white;border:0;font-size:20px;cursor:pointer}header #install{margin-left:auto;background:var(--green);padding:8px 12px;border-radius:9px;font-size:14px}aside{position:fixed;top:64px;bottom:0;width:220px;background:#111827;padding:15px}aside button{display:block;width:100%;padding:12px;margin:4px 0;text-align:left;border:0;border-radius:8px;background:none;color:#e5e7eb;cursor:pointer}aside button:hover{background:#1f2937}main{margin-left:220px;padding:24px;max-width:1200px}.pg{display:none}.pg.on{display:block}.card,.cards>div{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cards strong{display:block;font-size:23px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;color:var(--muted);margin-bottom:10px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:5px;color:var(--text);background:white}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{background:var(--green);color:white;border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer}.result{margin-top:15px;padding:16px;background:#f8fafc;border-radius:10px;line-height:1.8}.big{font-size:26px;color:var(--green);font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:800px){aside{transform:translateX(-100%);transition:.2s}aside.open{transform:translateX(0)}main{margin:0;padding:15px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media print{header,aside,.buttons{display:none!important}main{margin:0}.pg{display:none!important}.pg#orc{display:block!important}}
</style><title>LBS 3D</title></head><body>
<header><button onclick="menu()">☰</button><b>LBS 3D</b><button id="install" hidden>＋ Instalar</button></header>
<aside id="side"><button onclick="page('dash')">🏠 Dashboard</button><button onclick="page('orc')">📋 Orçamento</button><button onclick="page('vendas')">💰 Vendas</button><button onclick="page('prod')">📦 Produtos</button><button onclick="page('fil')">🧵 Filamentos</button><button onclick="page('cli')">👥 Clientes</button><button onclick="page('cfg')">⚙️ Configurações</button></aside>
<main>
<section id="dash" class="pg on"><h1>Dashboard</h1><div class="cards"><div>Faturamento<strong id="fat">R$ 0,00</strong></div><div>Lucro<strong id="luc">R$ 0,00</strong></div><div>Vendas<strong id="nv">0</strong></div><div>Filamento<strong id="peso">0 g</strong></div></div><div class="card"><h2>Últimas vendas</h2><div id="last"></div></div></section>
<section id="orc" class="pg"><h1>Novo orçamento</h1><div class="card"><div class="grid">
<label>Cliente<input id="cliente"></label><label>WhatsApp<input id="whats"></label><label>Produto<input id="produto"></label><label>Quantidade<input id="q" type="number" value="1"></label><label>Peso por peça (g)<input id="g" type="number" value="100"></label><label>Tempo (h)<input id="h" type="number" step=".01" value="4"></label><label>Filamento R$/kg<input id="kg" type="number" value="75" step=".01"></label><label>Energia R$<input id="energia" type="number" value="1.5" step=".01"></label><label>Embalagem R$<input id="emb" type="number" value="2" step=".01"></label><label>Outros R$<input id="outros" type="number" value="0" step=".01"></label><label>Máquina R$<input id="maq" type="number" value="1" step=".01"></label><label>Margem %<input id="margem" type="number" value="150"></label></div>
<div class="buttons"><button onclick="calc()">Calcular</button><button onclick="window.print()">🖨️ PDF</button><button onclick="wa()">📱 WhatsApp</button><button onclick="venda()">💰 Registrar venda</button></div><div id="res" class="result"></div></div></section>
<section id="vendas" class="pg"><h1>Vendas</h1><div class="card"><div class="buttons"><button onclick="csv()">⬇️ CSV</button><button onclick="sync()">☁️ Google Sheets</button></div><div id="vt"></div></div></section>
<section id="prod" class="pg"><h1>Produtos</h1><div class="card"><div class="grid"><label>Nome<input id="pn"></label><label>Peso g<input id="pg" type="number"></label><label>Tempo h<input id="ph" type="number" step=".01"></label></div><div class="buttons"><button onclick="addProd()">Salvar</button></div><div id="pt"></div></div></section>
<section id="fil" class="pg"><h1>Filamentos</h1><div class="card"><div class="grid"><label>Nome/cor<input id="fn"></label><label>Fabricante<input id="ff"></label><label>R$/kg<input id="fk" type="number" step=".01"></label><label>Estoque g<input id="fe" type="number"></label></div><div class="buttons"><button onclick="addFil()">Salvar</button></div><div id="ft"></div></div></section>
<section id="cli" class="pg"><h1>Clientes</h1><div class="card"><div class="grid"><label>Nome<input id="cn"></label><label>WhatsApp<input id="cw"></label></div><div class="buttons"><button onclick="addCli()">Salvar</button></div><div id="ct"></div></div></section>
<section id="cfg" class="pg"><h1>Configurações</h1><div class="card"><label>Empresa<input id="empresa" value="LBS 3D"></label><label>URL do Google Apps Script<input id="url"></label><label>kWh R$<input id="kwh" type="number" step=".01" value="1"></label><div class="buttons"><button onclick="saveCfg()">Salvar</button><button onclick="wipe()">Apagar dados</button></div></div></section>
</main><script>
const K="lbs3d_pwa";let db=JSON.parse(localStorage.getItem(K)||'{"vendas":[],"produtos":[],"filamentos":[],"clientes":[],"cfg":{"url":"","empresa":"LBS 3D","kwh":1}}');let last=null;const M=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),N=id=>Number(document.getElementById(id).value||0),S=()=>localStorage.setItem(K,JSON.stringify(db));function menu(){document.getElementById("side").classList.toggle("open")}function page(id){document.querySelectorAll(".pg").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");document.getElementById("side").classList.remove("open");if(id=="dash")dash();if(id=="vendas")renderVendas();if(id=="prod")renderProd();if(id=="fil")renderFil();if(id=="cli")renderCli()}function calc(){let q=N("q"),g=N("g"),kg=N("kg"),c=(g*q/1000)*kg+N("energia")+N("emb")+N("outros")+N("maq"),v=c*(1+N("margem")/100);last={data:new Date().toISOString(),cliente:document.getElementById("cliente").value,whats:document.getElementById("whats").value,produto:document.getElementById("produto").value,q,peso:g*q,horas:N("h"),custo:+c.toFixed(2),venda:+v.toFixed(2),lucro:+(v-c).toFixed(2),status:"Pendente"};document.getElementById("res").innerHTML=`Custo total: <b>${M(c)}</b><br>Lucro: <b>${M(v-c)}</b><div class="big">Preço: ${M(v)}</div>`}function venda(){if(!last)calc();db.vendas.unshift(last);S();alert("Venda salva no dispositivo.");dash()}function wa(){if(!last)calc();open("https://wa.me/?text="+encodeURIComponent(`Olá! Orçamento LBS 3D\nProduto: ${last.produto}\nQuantidade: ${last.q}\nValor: ${M(last.venda)}`))}function tab(a){if(!a.length)return"<p>Nenhum registro.</p>";return"<table><tr><th>Data</th><th>Cliente</th><th>Produto</th><th>Venda</th><th>Lucro</th></tr>"+a.map(x=>`<tr><td>${new Date(x.data).toLocaleDateString("pt-BR")}</td><td>${x.cliente}</td><td>${x.produto}</td><td>${M(x.venda)}</td><td>${M(x.lucro)}</td></tr>`).join("")+"</table>"}function dash(){let v=db.vendas;document.getElementById("fat").textContent=M(v.reduce((s,x)=>s+x.venda,0));document.getElementById("luc").textContent=M(v.reduce((s,x)=>s+x.lucro,0));document.getElementById("nv").textContent=v.length;document.getElementById("peso").textContent=v.reduce((s,x)=>s+x.peso,0)+" g";document.getElementById("last").innerHTML=tab(v.slice(0,10))}function renderVendas(){document.getElementById("vt").innerHTML=tab(db.vendas)}function addProd(){let x={nome:pn.value,peso:N("pg"),horas:N("ph")};if(!x.nome)return;db.produtos.push(x);S();renderProd()}function renderProd(){pt.innerHTML=db.produtos.map((x,i)=>`<p>${x.nome} — ${x.peso}g — ${x.horas}h <button onclick="db.produtos.splice(${i},1);S();renderProd()">Excluir</button></p>`).join("")}function addFil(){let x={nome:fn.value,fab:ff.value,kg:N("fk"),estoque:N("fe")};if(!x.nome)return;db.filamentos.push(x);S();renderFil()}function renderFil(){ft.innerHTML=db.filamentos.map((x,i)=>`<p>${x.nome} — ${M(x.kg)}/kg — ${x.estoque}g <button onclick="db.filamentos.splice(${i},1);S();renderFil()">Excluir</button></p>`).join("")}function addCli(){let x={nome:cn.value,whats:cw.value};if(!x.nome)return;db.clientes.push(x);S();renderCli()}function renderCli(){ct.innerHTML=db.clientes.map((x,i)=>`<p>${x.nome} — ${x.whats} <button onclick="db.clientes.splice(${i},1);S();renderCli()">Excluir</button></p>`).join("")}function saveCfg(){db.cfg={empresa:empresa.value,url:url.value,kwh:N("kwh")};S();alert("Configurações salvas.")}function wipe(){if(confirm("Apagar todos os dados?")){localStorage.removeItem(K);location.reload()}}function csv(){let rows=[["Data","Cliente","Produto","Qtd","Peso","Custo","Venda","Lucro"],...db.vendas.map(x=>[x.data,x.cliente,x.produto,x.q,x.peso,x.custo,x.venda,x.lucro])];let t=rows.map(r=>r.join(";")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="lbs3d-vendas.csv";a.click()}async function sync(){if(!db.cfg.url)return alert("Cadastre a URL do Apps Script em Configurações.");try{let r=await fetch(db.cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({vendas:db.vendas})});alert(await r.text())}catch(e){alert("Erro de conexão com o Google Sheets.")}}document.addEventListener("DOMContentLoaded",()=>{empresa.value=db.cfg.empresa||"LBS 3D";url.value=db.cfg.url||"";kwh.value=db.cfg.kwh||1;dash()});let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
</script><script>navigator.serviceWorker?.register("sw.js")</script></body></html>
